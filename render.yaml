services:
  - type: web
    name: arbiter-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGINS
        value: https://arbiter.vercel.app,https://arbiter-frontend.vercel.app
        sync: false
      - key: RABOT_DATA_DIR
        value: data
      - key: RABOT_AUTO_UPDATE_ON_START
        value: "false"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: TUSHARE_TOKEN
        sync: false
      - key: LONGBRIDGE_APP_KEY
        sync: false
      - key: LONGBRIDGE_APP_SECRET
        sync: false
      - key: LONGBRIDGE_ACCESS_TOKEN
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: ALPHAVANTAGE_API_KEY
        sync: false
