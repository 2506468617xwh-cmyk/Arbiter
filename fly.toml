app = "nuonuo-rabot"

[build]

[env]
  APP_ENV = "production"
  FRONTEND_ORIGINS = "https://nuonuo-rabot.vercel.app"
  RABOT_DATA_DIR = "/app/data"
  DEEPSEEK_BASE_URL = "https://api.deepseek.com"
  DEEPSEEK_MODEL = "deepseek-chat"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "rabot_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
